<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-label="ompa architecture">
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9198a1"/></marker></defs>
<rect x="20" y="30" width="250" height="150" rx="10" fill="none" stroke="#3d444d" stroke-width="1.2"/>
<text x="34" y="54" font-size="15" font-weight="700" fill="#e6edf3">Your agent</text>
<text x="34" y="76" font-size="13" fill="#9198a1">Claude Code, Codex, Gemini CLI,</text>
<text x="34" y="95" font-size="13" fill="#9198a1">OpenClaw, LangChain, custom</text>
<rect x="20" y="220" width="250" height="150" rx="10" fill="none" stroke="#3d444d" stroke-width="1.2"/>
<text x="34" y="244" font-size="15" font-weight="700" fill="#e6edf3">Interfaces</text>
<text x="34" y="266" font-size="13" fill="#9198a1">MCP server: 24 tools (ao-mcp)</text>
<text x="34" y="285" font-size="13" fill="#9198a1">CLI: ao ...</text>
<text x="34" y="304" font-size="13" fill="#9198a1">Python: Ompa(...)</text>
<text x="34" y="323" font-size="13" fill="#9198a1">5 lifecycle hooks</text>
<line x1="145" y1="180" x2="145" y2="218" stroke="#9198a1" stroke-width="1.6" marker-end="url(#ah)"/>
<rect x="330" y="30" width="260" height="110" rx="10" fill="none" stroke="#a371f7" stroke-width="2"/>
<text x="344" y="54" font-size="15" font-weight="700" fill="#e6edf3">Layer 1: Vault</text>
<text x="344" y="76" font-size="13" fill="#9198a1">verbatim markdown notes</text>
<text x="344" y="95" font-size="13" fill="#9198a1">Obsidian-compatible folders</text>
<rect x="330" y="150" width="260" height="110" rx="10" fill="none" stroke="#a371f7" stroke-width="2"/>
<text x="344" y="174" font-size="15" font-weight="700" fill="#e6edf3">Layer 2: Palace</text>
<text x="344" y="196" font-size="13" fill="#9198a1">wings, rooms, drawers,</text>
<text x="344" y="215" font-size="13" fill="#9198a1">halls and tunnels</text>
<rect x="330" y="270" width="260" height="110" rx="10" fill="none" stroke="#a371f7" stroke-width="2"/>
<text x="344" y="294" font-size="15" font-weight="700" fill="#e6edf3">Layer 3: Temporal KG</text>
<text x="344" y="316" font-size="13" fill="#9198a1">SQLite triples with</text>
<text x="344" y="335" font-size="13" fill="#9198a1">validity windows, as_of</text>
<rect x="650" y="30" width="270" height="150" rx="10" fill="none" stroke="#3d444d" stroke-width="1.2"/>
<text x="664" y="54" font-size="15" font-weight="700" fill="#e6edf3">Search</text>
<text x="664" y="76" font-size="13" fill="#9198a1">SQLite FTS5 keyword (BM25)</text>
<text x="664" y="95" font-size="13" fill="#9198a1">+ local MiniLM (ompa[semantic])</text>
<text x="664" y="114" font-size="13" fill="#9198a1">fused by RRF; temporal=True</text>
<text x="664" y="133" font-size="13" fill="#9198a1">date windows (opt-in)</text>
<rect x="650" y="220" width="270" height="150" rx="10" fill="none" stroke="#3d444d" stroke-width="1.2" stroke-dasharray="6 4"/>
<text x="664" y="244" font-size="15" font-weight="700" fill="#e6edf3">Audit memory (opt-in)</text>
<text x="664" y="266" font-size="13" fill="#9198a1">hash-chained log, HMAC / Ed25519</text>
<text x="664" y="285" font-size="13" fill="#9198a1">provenance citations, as_of,</text>
<text x="664" y="304" font-size="13" fill="#9198a1">retention, erasure, ACLs</text>
<rect x="980" y="30" width="200" height="150" rx="10" fill="none" stroke="#a371f7" stroke-width="2"/>
<text x="994" y="54" font-size="15" font-weight="700" fill="#e6edf3">Results</text>
<text x="994" y="76" font-size="13" fill="#9198a1">path + line citation</text>
<text x="994" y="95" font-size="13" fill="#9198a1">content hash</text>
<text x="994" y="114" font-size="13" fill="#9198a1">valid_from / stale</text>
<line x1="270" y1="105" x2="328" y2="85" stroke="#9198a1" stroke-width="1.6" marker-end="url(#ah)"/>
<line x1="590" y1="85" x2="648" y2="95" stroke="#9198a1" stroke-width="1.6" marker-end="url(#ah)"/>
<line x1="920" y1="105" x2="978" y2="105" stroke="#9198a1" stroke-width="1.6" marker-end="url(#ah)"/>
<text x="980" y="250" font-size="13" fill="#9198a1">No LLM to store or search.</text>
<text x="980" y="270" font-size="13" fill="#9198a1">Keyword search needs no</text>
<text x="980" y="288" font-size="13" fill="#9198a1">ML dependencies.</text>
<text x="980" y="318" font-size="13" fill="#9198a1">Dashed = off by default.</text>
</svg>
