[project]
name = "ompa"
version = "0.5.0"
description = "Universal AI agent memory layer — vault + palace + temporal knowledge graph"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "Micap AI", email = "info@micap.ai"},
]
keywords = [
    "ai", "agent", "memory", "obsidian", "knowledge-graph",
    "mcp", "claude", "llm", "rag", "semantic-search"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

dependencies = [
    "typer>=0.9.0",
    "rich>=13.0.0",
    "python-frontmatter>=1.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.1.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
    "mypy>=1.8.0",
]
semantic = [
    "numpy>=1.24.0",
    "sentence-transformers>=2.2.0",
]
all = [
    "ompa[semantic]",
]

[project.urls]
Homepage = "https://github.com/jmiaie/ompa"
Repository = "https://github.com/jmiaie/ompa"
Documentation = "https://github.com/jmiaie/ompa#readme"
"Bug Tracker" = "https://github.com/jmiaie/ompa/issues"

[project.scripts]
ao = "ompa.cli:main"
ao-mcp = "ompa.mcp_server:main"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["ompa*"]
exclude = ["tests*", "agent_memory*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
# Default pyflakes/pycodestyle (E, F, W) plus a curated set of bugbear-style
# rules that catch real issues without drowning the codebase in style noise.
select = [
    "E", "F", "W",   # pyflakes + pycodestyle
    "I",             # isort (import order)
    "B",             # flake8-bugbear (likely bugs)
    "UP",            # pyupgrade (modernize syntax)
    "SIM",           # flake8-simplify (obvious simplifications)
    "RUF",           # ruff-specific
    "C4",            # flake8-comprehensions
    "PIE",           # flake8-pie (misc lint)
]
ignore = [
    "E501",    # line length — black handles wrapping where it matters
    "B008",    # function-call-in-default-argument (Typer uses this pattern)
    "SIM108",  # ternary-over-if-else — often less readable
    "RUF001",  # ambiguous unicode in strings — intentional prose (× for multiplication, etc.)
    "RUF002",  # ambiguous unicode in docstrings — same rationale
    "RUF003",  # ambiguous unicode in comments — same rationale
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]  # assert False is fine in tests

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
    # python-frontmatter uses deprecated codecs.open internally.
    "ignore:codecs.open\\(\\) is deprecated:DeprecationWarning:frontmatter",
]

[tool.coverage.run]
source = ["ompa"]
branch = true
omit = [
    "ompa/__main__.py",
    "ompa/cli.py",  # Typer CLI covered by smoke tests, not unit tests
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]
show_missing = true
skip_covered = false

[tool.mypy]
python_version = "3.10"
# Gradual typing. Baseline passes; tighten by flipping flags as modules
# get cleaned up (warn_unreachable, strict_equality are next candidates).
ignore_missing_imports = true
warn_unused_ignores = false
warn_redundant_casts = true
check_untyped_defs = false
no_implicit_optional = true
